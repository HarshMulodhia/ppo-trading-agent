# Conda Environment for PPO Trading Agent
# Supports GPU training with PyTorch CUDA
#
# Create:  conda env create -f environment.yml
# Activate: conda activate ppo-trading
# Update:  conda env update -f environment.yml --prune

name: ppo-trading
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python>=3.9,<3.13

  # PyTorch with CUDA support
  - pytorch>=2.0.0
  - torchvision>=0.15.0
  - pytorch-cuda=12.1

  # Core RL & ML
  - numpy>=1.23.0
  - pandas>=1.5.0
  - scipy>=1.10.0
  - scikit-learn>=1.2.0

  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0

  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.65.0
  - requests>=2.31.0

  # Development & Testing
  - pytest>=7.3.0
  - pytest-cov>=4.1.0
  - black>=23.7.0
  - flake8>=6.0.0
  - mypy>=1.4.0
  - isort>=5.12.0

  # Pip-only packages
  - pip
  - pip:
      # RL Framework
      - gymnasium>=0.26.0
      - stable-baselines3>=2.0.0

      # Financial Data
      - yfinance>=0.2.28
      - pytz>=2023.3
      - pyarrow>=12.0.0

      # ML & Optimization
      - optuna>=3.8.0

      # Monitoring & Logging
      - tensorboard>=2.12.0
      - wandb>=0.14.0

      # Visualization
      - plotly>=5.14.0

      # Notebooks
      - jupyter>=1.0.0
      - jupyterlab>=4.0.0

      # Production
      - fastapi>=0.100.0
      - uvicorn>=0.23.0
      - pydantic>=2.0.0
      - python-multipart>=0.0.6

      # Environment variables
      - python-dotenv>=1.0.0

      # Documentation
      - sphinx>=7.0.0
      - sphinx-rtd-theme>=1.3.0
