name: Tests & Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pylint bandit
      
      - name: Lint with pylint
        run: |
          pylint src/ scripts/ --rcfile=.pylintrc --exit-zero
      
      - name: Format check with black
        run: |
          black --check src/ scripts/ tests/
      
      - name: Type check with mypy
        run: |
          mypy src/ --ignore-missing-imports --no-error-summary 2>/dev/null || true
      
      - name: Run pytest with coverage
        run: |
          pytest tests/ --cov=src --cov-report=xml --cov-report=html --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
      
      - name: Security check with bandit
        run: |
          bandit -r src/ -ll 2>/dev/null || true
